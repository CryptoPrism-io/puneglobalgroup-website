name: Deploy Outreach CRM to AWS

on:
  push:
    branches: [master]
    paths:
      - "outreach/**"
      - ".github/workflows/deploy-outreach.yml"
  workflow_dispatch:

concurrency:
  group: outreach-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pgg-outreach
  INSTANCE_ID: i-00874f0cc21796de6
  DEPLOY_ROLE: arn:aws:iam::405633560616:role/gha-pgg-outreach-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: outreach/package-lock.json

      - name: Verify application
        working-directory: outreach
        run: |
          npm ci
          npm run check:whatsapp

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            docker build -t "$IMAGE" outreach
            docker push "$IMAGE"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy privately through SSM
        id: deploy
        run: |
          SCRIPT_B64="$(base64 -w0 outreach/deploy/deploy-aws.sh)"
          REMOTE_COMMAND="echo '$SCRIPT_B64' | base64 -d > /usr/local/bin/pgg-outreach-deploy && chmod 750 /usr/local/bin/pgg-outreach-deploy && /usr/local/bin/pgg-outreach-deploy '$IMAGE'"
          jq -n --arg command "$REMOTE_COMMAND" '{commands:[$command]}' > ssm-parameters.json
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --comment "Deploy outreach $GITHUB_SHA" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          test "$STATUS" = Success
